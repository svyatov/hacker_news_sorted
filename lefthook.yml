# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json
# Print failed jobs and the summary only: passing jobs' output (the wxt build spinner) is noise.
output:
  - failure
  - summary

pre-commit:
  parallel: true
  jobs:
    # Work reaches main through a squash-merged PR. Skip with LEFTHOOK_EXCLUDE=branch for a deliberate direct commit.
    - name: branch
      run: '[ "$(git branch --show-current)" != main ] || { echo "Commit on a branch: git switch -c type/kebab-description"; exit 1; }'
    - name: secrets
      run: betterleaks git --pre-commit --staged --redact --verbose
    - name: biome
      run: bunx biome lint --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: prettier
      run: bunx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional
      run: |
        head -1 {1} | grep -qE '^(feat|fix|perf|refactor|docs|style|test|chore|ci|build|revert)(\(.+\))?!?: .+' || { echo "Use Conventional Commits: type(scope): description"; exit 1; }

pre-push:
  jobs:
    - name: lint
      run: bun run lint
    - name: test
      run: bun run test:coverage
    - name: build
      run: bun run build
